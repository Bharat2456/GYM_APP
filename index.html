<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F4BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kinetic Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
html{color-scheme:light}body{margin:0}
/* Layout concept: a single phone-width column (centred on desktop) with a fixed six-tab bar; the day's workout is the one big surface, everything else is ruled lists on the page ground. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E8ECF4; --line:#D8DEE9; --line2:#C5CDDB;
  --ink:#0E1522; --ink2:#43506A; --muted:#6F7A91;
  --accent:#2F4BFF; --accent-ink:#FFFFFF;
  --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--surface));
  --good:#0F7F46; --warn:#9A5B00; --bad:#BF2A2A; --gold:#B7791F;
  --good-soft:#DCF2E6; --warn-soft:#FDEFD3; --bad-soft:#FADFDF;
  --shadow:0 1px 2px rgba(14,21,34,.06),0 6px 20px rgba(14,21,34,.06);
  --f-display:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090D15; --surface:#121927; --surface2:#1B2437; --line:#263149; --line2:#33405E;
  --ink:#EDF1F9; --ink2:#B0BAD0; --muted:#8490AA;
  --accent:#7C8FFF; --accent-ink:#0A0E16;
  --good:#3CCB7F; --warn:#F0B24A; --bad:#FF8080; --gold:#E9B44C;
  --good-soft:#13301F; --warn-soft:#38290D; --bad-soft:#3B1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090D15; --surface:#121927; --surface2:#1B2437; --line:#263149; --line2:#33405E;
  --ink:#EDF1F9; --ink2:#B0BAD0; --muted:#8490AA;
  --accent:#7C8FFF; --accent-ink:#0A0E16;
  --good:#3CCB7F; --warn:#F0B24A; --bad:#FF8080; --gold:#E9B44C;
  --good-soft:#13301F; --warn-soft:#38290D; --bad-soft:#3B1717;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;line-height:1.05}
h1{font-size:2.35rem;text-transform:uppercase}
h2{font-size:1.55rem;text-transform:uppercase}
h3{font-size:1.2rem}
a{color:var(--accent)}
.num{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.label{font-size:.72rem;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

#app{max-width:520px;margin:0 auto;min-height:100%;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 104px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:6px 4px}
.top p{margin-top:4px}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.tight{padding:12px}
.card.hero{padding:18px}
.card.tint{background:var(--accent-soft);box-shadow:none}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;min-width:0}
.li.click{cursor:pointer}
.li .t{font-weight:600}

.btn{appearance:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 18px;min-height:46px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.1}
.btn:active{transform:translateY(1px)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad);color:#fff}
.btn.dangerghost{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:.9rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{appearance:none;border:0;background:var(--surface2);color:var(--ink);width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.link{appearance:none;border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;cursor:pointer;text-align:left}

.chip{appearance:none;border:1.5px solid var(--line2);background:transparent;color:var(--ink2);border-radius:999px;padding:7px 13px;font-weight:500;font-size:.92rem;cursor:pointer;line-height:1.1;min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sq{border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.88rem;color:var(--ink2);cursor:pointer;min-height:36px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-weight:600;font-size:.9rem}
.inp{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);padding:10px 12px;color:var(--ink)}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.inp.sm{min-height:38px;padding:6px 8px;text-align:center}
textarea.inp{resize:vertical;min-height:80px}
.help{font-size:.84rem;color:var(--muted)}
.err{font-size:.86rem;color:var(--bad);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);margin:1px 0 0;flex:none}

.callout{border-radius:12px;padding:12px 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.callout.warn{background:var(--warn-soft);color:var(--ink)} .callout.bad{background:var(--bad-soft);color:var(--ink)} .callout.good{background:var(--good-soft);color:var(--ink)} .callout.info{background:var(--accent-soft);color:var(--ink)}
.callout svg{flex:none;margin-top:2px}

.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>i{background:var(--good)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tabbar button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:.68rem;font-weight:600;letter-spacing:.02em;cursor:pointer;border-radius:10px;min-height:48px}
.tabbar button.on{color:var(--accent)}
.tabbar button.on svg{stroke-width:2.3}

.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.overlay>.in{max-width:520px;margin:0 auto;min-height:100%;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.footbar>div{max-width:520px;margin:0 auto;display:flex;gap:10px}
.sheetwrap{position:fixed;inset:0;z-index:80;background:rgba(5,9,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sheet .grab{width:44px;height:4px;border-radius:9px;background:var(--line2);margin:-6px auto 14px}
@media(min-width:700px){.sheetwrap{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;max-width:min(92vw,440px);box-shadow:var(--shadow)}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.8rem;font-weight:600;max-width:240px;transform:translate(-50%,-100%)}

/* today / week */
.today{display:flex;flex-direction:column;gap:14px}
.today .big{font-family:var(--f-display);font-weight:700;font-size:2.7rem;line-height:.95;text-transform:uppercase}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--muted)}
.wd .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);font-family:var(--f-display);font-size:1.05rem;color:var(--ink2);font-weight:700}
.wd.plan .dot{border-color:var(--accent);color:var(--accent)}
.wd.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wd.today .dot{box-shadow:0 0 0 3px var(--accent-soft)}
.wd.today{color:var(--ink)}
.wd.miss .dot{border-style:dashed;border-color:var(--bad);color:var(--bad)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .u{font-size:.8rem;color:var(--muted);font-weight:500}
.ex-name{font-weight:600}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center}
.sets.nokg{grid-template-columns:34px 1fr 46px}
.setdone{appearance:none;border:2px solid var(--line2);background:transparent;border-radius:12px;height:44px;width:46px;display:grid;place-items:center;cursor:pointer;color:var(--accent-ink)}
.setdone.on{background:var(--good);border-color:var(--good)}
.restbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:56;padding-inline:max(16px,env(safe-area-inset-right,0px))}
.restbar>div{max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.restbar .num{font-size:1.8rem}

/* camera */
.cam{position:fixed;inset:0;z-index:60;background:#05080f;color:#fff;display:flex;flex-direction:column}
.cam .stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;background:#05080f}
.cam video,.cam canvas{max-width:100%;max-height:100%}
.cam .stage .layer{position:absolute;inset:0;width:100%;height:100%}
.cam canvas.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam video{width:100%;height:100%;object-fit:contain;transform:scaleX(-1)}
.cam .hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;gap:8px;align-items:flex-start;pointer-events:none}
.cam .hud>*{pointer-events:auto}
.cam .rec{display:inline-flex;align-items:center;gap:7px;background:rgba(190,30,30,.92);padding:5px 11px;border-radius:99px;font-size:.78rem;font-weight:700;letter-spacing:.05em}
.cam .rec i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
.cam .sim{background:#B7791F}
@keyframes pulse{50%{opacity:.25}}
.cam .repbox{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));text-align:center;background:rgba(5,8,15,.66);border-radius:16px;padding:8px 16px}
.cam .repbox .n{font-family:var(--f-display);font-weight:700;font-size:3.6rem;line-height:.9}
.cam .cue{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:12px;background:rgba(5,8,15,.78);border-radius:14px;padding:12px 14px;font-weight:600;min-height:52px;display:flex;align-items:center;gap:10px}
.cam .cue.good{background:rgba(15,127,70,.92)} .cam .cue.warn{background:rgba(154,91,0,.94)}
.cam .ctl{background:#0A0F1A;padding:12px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center}
.cam .ctl .btn.ghost{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.figure{width:100%;aspect-ratio:1/1;max-height:260px;border-radius:14px;background:var(--surface2);display:block}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font:600 11px var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{stroke:var(--line2);stroke-width:1}
.chart .barf{fill:var(--accent)}
.chart .barf.dim{fill:color-mix(in srgb,var(--accent) 40%,var(--surface))}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:color-mix(in srgb,var(--accent) 14%,transparent)}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .tgt{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:4 4}
.chart .vl{fill:var(--ink);font-weight:700}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--ink2);vertical-align:middle;margin-right:6px}
.legend i.sw{height:10px;width:10px;border:0;background:var(--accent);border-radius:3px}
table.t{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
table.t td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
.scroll-x{overflow-x:auto}

/* coach */
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:5px}
.msg .src{display:block;margin-top:6px;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.composer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:19;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 24%)}
.composer>div{max-width:520px;margin:0 auto;display:flex;gap:8px}
.composer .inp{border-radius:99px;padding-inline:16px}

.progress-steps{display:flex;gap:4px}
.progress-steps i{flex:1;height:4px;border-radius:9px;background:var(--line2)}
.progress-steps i.on{background:var(--accent)}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.5rem;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .num{font-size:1.4rem;color:var(--ink2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:380px){h1{font-size:2rem}.today .big{font-size:2.3rem}.tabbar button{font-size:.62rem}}

</style>
</head>
<body>
<div id="app"><div id="boot" class="empty" role="status"><span class="spin"></span><p class="small" style="margin-top:10px">Loading your training…</p></div><main id="main" aria-live="off"></main></div>
<div id="tabbar" class="tabbar" hidden></div>
<div id="coachComposer" class="composer" hidden><div><input id="coachInput" class="inp" placeholder="Ask your coach…" aria-label="Message your coach" autocomplete="off" enterkeyhint="send"><button id="coachSend" class="btn" data-act="coach-send" aria-label="Send message"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-7z"/></svg></button></div></div>

<script>
window.__STANDALONE=true;
/* data.js — exercise library + food database. Plain data, no logic. */
(function (root) {
  const FIT = (root.FIT = root.FIT || {});

  // eq = any-of equipment tokens (empty = bodyweight); req = all-of tokens.
  // pat = movement pattern used by the planner. avoid = body areas to skip when the user reports a limitation there.
  // an = key of the pose analyzer that supports this exercise (null = no camera analysis).
  // d = defaults: reps (number) or secs, plus sets.
  const X = (o) => o;
  FIT.EXERCISES = [
    X({ id: 'bw_squat', name: 'Bodyweight squat', cat: 'Strength', pat: 'squat', diff: 1, eq: [], muscles: ['Quadriceps', 'Glutes', 'Core'], avoid: ['knee'], an: 'squat',
      desc: 'A basic squat that trains the legs and hips using only your body weight.',
      start: 'Stand with feet shoulder-width apart, toes turned out slightly, arms in front for balance.',
      steps: ['Push your hips back and bend your knees as if sitting into a chair.', 'Keep your chest up and your heels on the floor.', 'Lower until thighs are about parallel, or as far as you can control.', 'Press through your whole foot to stand tall.'],

      const seg = '<div class="scroll-x"><div class="seg" role="tablist" style="min-width:420px">' + [['overview', 'Overview'], ['customers', 'Customers'], ['invites', 'Invites'], ['branding', 'Branding'], ['billing', 'Billing'], ['isolation', 'Isolation']].map(([k, l]) => '<button role="tab" class="' + (tab === k ? 'on' : '') + '" data-act="gym-tab" data-k="' + k + '">' + l + '</button>').join('') + '</div></div>';
      body = sw + seg + gymTab(tab, st, g, admin);
    }
    const o = A.overlay('<div class="stack">' + head + body + '</div>', 'gym'); if (GU().keep) { o.scrollTop = GU().keep; GU().keep = 0; }
  }
  const gRedraw = () => { const o = $('#gym'); GU().keep = o ? o.scrollTop : 0; A.saveKV('gymUi'); drawGym(); };
  function gymTab(tab, st, g, admin) {
    if (tab === 'overview') {

      return '<div class="grid2">' + [['Customers', a.customers], ['Linked to app', a.linkedApp], ['Referred', a.referred], ['Converted', a.converted], ['Test revenue', a.testRevenue], ['Test commission', a.testCommission]].map(([l, v]) => '<div class="card kpi"><span class="label">' + l + '</span><span class="v">' + v + '</span></div>').join('') + '</div><p class="tiny muted">Revenue and commission come from TEST transactions only. No real money has moved.</p><div class="card stack-s"><b>Subscription</b><p class="small ink2">Plan: ' + esc(g.sub.plan) + ' (' + g.sub.mode + ' mode)</p></div>';
    }
    if (tab === 'customers') {
      const list = FIT.listCustomers(G(), st.id, g.id);
      return '<div class="card stack"><b>' + list.length + ' customer' + (list.length === 1 ? '' : 's') + '</b>' + (list.length ? '<div class="list">' + list.map((m) => { const mem = G().members.find((x) => x.id === m.id), isMe = mem.customerId && mem.customerId === S.customerId; const sum = isMe ? FIT.customerSummaryForGym(mem, { sessions: S.sessions }) : null; return '<div class="li" style="align-items:flex-start"><div class="grow"><b>' + esc(m.name) + '</b> ' + (m.manual ? '<span class="pill">added by staff</span>' : '<span class="pill acc">app user</span>') + '<div class="small ink2">Joined ' + A.fmtDate(m.joinedAt) + ' · via ' + esc(m.via) + '</div>' + (sum ? '<div class="tiny ink2">' + (sum.sessionsLast30 != null ? 'Workouts (30 days): ' + sum.sessionsLast30 : 'Customer has not shared workout count') + (sum.totals ? ' · ' + sum.totals.sessions + ' sessions, ' + sum.totals.minutes + ' min total' : '') + '</div>' : '') + '</div></div>'; }).join('') + '</div>' : '<div class="empty small">No customers yet. Create an invite code or add one by hand.</div>') + '</div><div class="card stack"><b>Add a customer manually</b><div class="field"><label for="cN">Name</label><input id="cN" class="inp"></div><div id="cErr" class="err"></div><button class="btn soft block" data-act="gym-addcust">Add customer</button></div>';
    }
    if (tab === 'invites') {
      const codes = FIT.listCodes(G(), st.id, g.id);
      return '<div class="card stack"><b>Customer invite and referral codes</b><div class="field"><label for="kL">Label (where you will share it)</label><input id="kL" class="inp" placeholder="Instagram, front desk, trainer name"></div><button class="btn block" data-act="gym-code">Create customer code</button>' + (admin ? '<hr class="rule"><b>Staff invitations</b><div class="field"><label for="kS">Staff name</label><input id="kS" class="inp"></div><button class="btn soft block" data-act="gym-scode">Create staff invite</button>' : '<p class="small muted">Only admins can invite staff.</p>') + '</div><div class="card stack-s"><b>Codes</b>' + (codes.length ? '<div class="list">' + codes.slice().reverse().map((c) => '<div class="li"><div class="grow"><b class="num" style="font-size:1.3rem">' + esc(c.code) + '</b><div class="small ink2">' + (c.kind === 'staff' ? 'Staff · ' + esc(c.label) : 'Customer · ' + esc(c.label)) + ' · used ' + c.uses + (c.maxUses ? '/' + c.maxUses : '') + '</div></div><button class="btn ghost sm" data-act="gym-copy" data-c="' + esc(c.code) + '">Copy</button></div>').join('') + '</div>' : '<p class="small muted">No codes yet.</p>') + '</div><p class="tiny muted">To try a customer code, go to Profile → Your gym and enter it. Referral attribution is recorded when the code is redeemed.</p>';
    }
    if (tab === 'branding') {
      if (!admin) return '<div class="callout warn">' + ic('lock') + '<span>Only admins can change branding.</span></div>';
      const b = g.branding;
      return '<div class="card stack"><b>Branding mode</b><div class="seg" role="group" aria-label="Branding mode"><button class="' + (b.mode === 'shared' ? 'on' : '') + '" data-act="gym-mode" data-k="shared">Shared platform</button><button class="' + (b.mode === 'custom' ? 'on' : '') + '" data-act="gym-mode" data-k="custom">Gym-specific</button></div><p class="small ink2">' + (b.mode === 'shared' ? 'Customers use the central app and see your gym name as a connected gym.' : 'Customers see your logo, colour, display name and welcome message throughout the app.') + ' The app and data stay shared in both modes.</p></div>' +
        '<div class="card stack"><div class="field"><label for="bN">Display name</label><input id="bN" class="inp" value="' + esc(b.displayName) + '"></div><div class="field"><label for="bW">Welcome message</label><input id="bW" class="inp" value="' + esc(b.welcome) + '"></div><div class="field"><label for="bK">Brand colour</label><input id="bK" type="color" value="' + esc(b.color) + '" style="width:64px;height:44px;border:0;background:none;padding:0"></div><div class="field"><span class="lab">Logo</span><label class="btn ghost sm" for="bL" style="width:max-content;cursor:pointer">Choose image</label><input id="bL" class="sr" type="file" accept="image/*" data-ch="gym-logo">' + (b.logo ? '<button class="link small" data-act="gym-logo-rm">Remove logo</button>' : '') + '</div><div class="field"><label for="bC">Gym content shown to customers (programme notes, hours, offers)</label><textarea id="bC" class="inp" rows="3">' + esc(b.content) + '</textarea></div><div id="bErr" class="err"></div><button class="btn block" data-act="gym-brand-save">Save branding</button></div>' +
        '<div class="card stack-s"><span class="label">What a customer sees (' + (b.mode === 'custom' ? 'gym-specific' : 'shared') + ')</span><div class="row card flat" style="padding:12px"><div class="logo" style="background:' + (b.mode === 'custom' ? esc(b.color) : 'var(--accent)') + '">' + (b.mode === 'custom' && b.logo ? '<img alt="" src="' + esc(b.logo) + '">' : esc((b.displayName || g.name).charAt(0).toUpperCase())) + '</div><div class="grow"><div class="label">' + (b.mode === 'custom' ? 'Your gym' : 'Connected gym') + '</div><b>' + esc(b.displayName || g.name) + '</b><div class="small ink2">' + esc(b.mode === 'custom' ? b.welcome : 'Training with ' + g.name) + '</div></div></div>' + (b.mode === 'custom' && b.content ? '<p class="small ink2">' + esc(b.content) + '</p>' : '') + '</div>';
    }
    if (tab === 'billing') {
      const tx = G().transactions.filter((t) => t.gymId === g.id), members = G().members.filter((m) => m.gymId === g.id), cfg = G().config;
      return '<div class="callout warn">' + ic('alert') + '<span><b>Test mode.</b> Nothing here takes real payment. Every transaction below is a simulated TEST record.</span></div>' +
        (admin ? '<div class="card stack"><b>Commercial settings</b><div class="field"><label for="cr">Referral commission rate (%)</label><input id="cr" class="inp" inputmode="decimal" value="' + cfg.commissionRate * 100 + '"></div>' + Object.keys(cfg.plans).filter((k) => k !== 'free').map((k) => '<div class="field"><label for="pp-' + k + '">' + esc(cfg.plans[k].label) + ' price (' + (cfg.plans[k].currency || 'INR') + ')</label><input id="pp-' + k + '" class="inp" inputmode="numeric" value="' + cfg.plans[k].price + '"></div>').join('') + '<button class="btn soft block" data-act="gym-cfg">Save settings</button></div>' : '<p class="small muted">Only admins can change prices.</p>') +
        '<div class="card stack"><b>Record a test transaction</b>' + (members.length ? '<div class="field"><label for="txM">Customer</label><select id="txM" class="inp">' + members.map((m) => '<option value="' + m.id + '">' + esc(m.name) + '</option>').join('') + '</select></div><div class="field"><label for="txP">Plan</label><select id="txP" class="inp">' + Object.keys(cfg.plans).filter((k) => k !== 'free').map((k) => '<option value="' + k + '">' + esc(cfg.plans[k].label) + ' · ' + cfg.plans[k].price + '</option>').join('') + '</select></div><button class="btn block" data-act="gym-tx">Record TEST transaction</button>' : '<p class="small muted">Add a customer first.</p>') + '</div>' +
        '<div class="card stack-s"><b>Transaction history</b>' + (tx.length ? '<div class="scroll-x"><table class="t"><thead><tr><th>Date</th><th>Plan</th><th>Amount</th><th>Commission</th><th></th></tr></thead><tbody>' + tx.slice().reverse().map((t) => '<tr><td>' + A.fmtDate(t.at) + '</td><td>' + esc(cfg.plans[t.planKey] ? cfg.plans[t.planKey].label : t.planKey) + '</td><td>' + t.amount + '</td><td>' + t.commission + '</td><td><span class="pill warn">TEST</span></td></tr>').join('') + '</tbody></table></div>' : '<p class="small muted">No transactions.</p>') + '</div>';
    }
    // isolation
    const others = G().gyms.filter((x) => x.id !== g.id);
    return '<div class="card stack"><b>Tenant isolation check</b><p class="small ink2">Tries to read or change another gym\'s customers, staff, codes, analytics and branding while signed in as ' + esc(st.name) + '. Every attempt should be refused.</p>' + (others.length ? '<button class="btn block" data-act="gym-iso">Run isolation check against ' + others.length + ' other gym' + (others.length > 1 ? 's' : '') + '</button>' : '<p class="small muted">Only one gym exists. Register a second gym to run this check.</p>') + '<div id="isoOut" class="stack-s"></div></div>';
  }
  A.acts['gym-tab'] = (el) => { GU().tab = el.dataset.k; gRedraw(); };
  A.ins['gym-actor'] = (el) => { GU().actor = el.value; gRedraw(); };
  A.acts['gym-new'] = () => { GU().actor = null; gRedraw(); };
  A.acts['gym-create'] = () => {
    try { const r = FIT.createGym(G(), { name: $('#gN').value, city: $('#gC').value, adminName: $('#gA').value, color: $('#gK').value }); GU().actor = r.admin.id; GU().tab = 'overview'; A.saveKV('gymdb'); gRedraw(); A.toast('Gym registered'); } catch (e) { $('#gErr').textContent = e.message + '.'; }
  };
  A.acts['gym-staffjoin'] = () => {
    try { const r = FIT.redeemCode(G(), $('#sCode').value, { name: $('#sName').value.trim() }); if (r.kind !== 'staff') throw new Error('That is a customer code. Enter it in Profile'); GU().actor = r.staff.id; GU().tab = 'customers'; A.saveKV('gymdb'); gRedraw(); } catch (e) { $('#sErr').textContent = e.message + '.'; }
  };

  A.acts['gym-copy'] = async (el) => { try { await navigator.clipboard.writeText(el.dataset.c); A.toast('Copied ' + el.dataset.c); } catch (e) { A.toast('Code: ' + el.dataset.c); } };
  A.acts['gym-mode'] = (el) => { try { FIT.setBranding(G(), actor().id, actor().gymId, { mode: el.dataset.k }); A.saveKV('gymdb'); A.applyTheme(); gRedraw(); } catch (e) { A.toast(e.message); } };
  A.acts['gym-brand-save'] = () => { try { FIT.setBranding(G(), actor().id, actor().gymId, { displayName: $('#bN').value.trim() || gymOf(actor()).name, welcome: $('#bW').value.trim(), color: $('#bK').value, content: $('#bC').value.trim() }); A.saveKV('gymdb'); A.applyTheme(); gRedraw(); A.toast('Branding saved'); } catch (e) { $('#bErr').textContent = e.message + '.'; } };
  A.acts['gym-logo-rm'] = () => { FIT.setBranding(G(), actor().id, actor().gymId, { logo: null }); A.saveKV('gymdb'); gRedraw(); };
  A.ins['gym-logo'] = (el) => {
    const f = el.files && el.files[0]; if (!f) return; if (f.size > 4e6) return A.toast('Choose an image under 4 MB.');
    const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 128; const k = Math.max(128 / im.width, 128 / im.height); c.getContext('2d').drawImage(im, (128 - im.width * k) / 2, (128 - im.height * k) / 2, im.width * k, im.height * k); FIT.setBranding(G(), actor().id, actor().gymId, { logo: c.toDataURL('image/png') }); A.saveKV('gymdb'); A.applyTheme(); gRedraw(); }; im.onerror = () => A.toast('That image could not be read.'); im.src = rd.result; }; rd.readAsDataURL(f);
  };
  A.acts['gym-cfg'] = () => { const cr = parseFloat($('#cr').value); if (!(cr >= 0 && cr <= 100)) return A.toast('Commission must be 0 to 100%.'); try { requireAdmin(); } catch (e) { return A.toast(e.message); } G().config.commissionRate = cr / 100; Object.keys(G().config.plans).filter((k) => k !== 'free').forEach((k) => { const v = parseFloat($('#pp-' + k).value); if (v >= 0) G().config.plans[k].price = v; }); A.saveKV('gymdb'); A.toast('Settings saved'); gRedraw(); };
  function requireAdmin() { FIT.authStaff(G(), actor().id, actor().gymId); if (actor().role !== 'admin') throw new Error('forbidden: admin only'); }
  A.acts['gym-tx'] = () => { try { FIT.recordTestTransaction(G(), actor().id, actor().gymId, { memberId: $('#txM').value, planKey: $('#txP').value }); A.saveKV('gymdb'); gRedraw(); A.toast('TEST transaction recorded'); } catch (e) { A.toast(e.message); } };
  A.acts['gym-iso'] = () => {
    const st = actor(), out = [];
    G().gyms.filter((x) => x.id !== st.gymId).forEach((o) => {
      [['View customers', () => FIT.listCustomers(G(), st.id, o.id)], ['View staff', () => FIT.listStaff(G(), st.id, o.id)], ['View referral codes', () => FIT.listCodes(G(), st.id, o.id)], ['View analytics and revenue', () => FIT.gymAnalytics(G(), st.id, o.id)], ['Change branding', () => FIT.setBranding(G(), st.id, o.id, { color: '#000000' })], ['Create a referral code', () => FIT.createReferralCode(G(), st.id, o.id, {})]].forEach(([l, f]) => {
        let refused = false, msg = ''; const before = JSON.stringify([G().codes.length, G().gyms.find((g) => g.id === o.id).branding]); try { f(); } catch (e) { refused = /forbidden/.test(e.message); msg = e.message; }
        const unchanged = before === JSON.stringify([G().codes.length, G().gyms.find((g) => g.id === o.id).branding]);
        out.push('<div class="li"><div class="grow small">' + esc(l) + ' of <b>' + esc(o.name) + '</b></div><span class="pill ' + (refused && unchanged ? 'good' : 'bad') + '">' + (refused && unchanged ? 'refused' : 'ALLOWED') + '</span></div>');
      });
    });
    $('#isoOut').innerHTML = '<div class="list">' + out.join('') + '</div>';
  };

  /* ================= BOOT ================= */
  async function boot() {
    try {
      await A.loadAll();
      const g = S.gymdb; ['gyms', 'staff', 'codes', 'members', 'referrals', 'transactions', 'trainers', 'assignments'].forEach((k) => { if (!Array.isArray(g[k])) g[k] = []; }); if (!g.config) g.config = FIT.emptyGymDb().config;
      const cut = FIT.ymd(Date.now() - 20 * 86400000); Object.keys(S.resched || {}).forEach((k) => { if (k < cut) delete S.resched[k]; });
      A.sortSessions(); A.applyTheme();
      const hash = (location.hash || '').replace('#', '');
      if (!S.profile) A.startOnboarding(false);
      else { if (['home', 'workout', 'coach', 'nutrition', 'progress', 'profile'].includes(hash)) S.ui.tab = hash; A.render(); }
      $('#boot').remove();
    } catch (e) { console.error(e); $('#boot').innerHTML = '<div class="card stack" style="margin:24px"><b>Something went wrong starting the app.</b><p class="small ink2">' + esc(e.message) + '</p></div>'; }
  }
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (S.profile && ['home', 'workout', 'coach', 'nutrition', 'progress', 'profile'].includes(h) && h !== S.ui.tab) { S.ui.tab = h; A.render(); } });
  A.boot = boot;
})();
