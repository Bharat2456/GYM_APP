name: Android APK build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        # No package-lock.json is committed (it could not be generated offline), so use npm install.
        run: npm install --no-audit --no-fund

      - name: Download pose model (MoveNet Lightning, bundled into the APK)
        run: bash scripts/fetch-model.sh

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (engine, database, services, pose mapping)
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # A plain *debug* APK does NOT contain the JavaScript bundle; it tries to reach a Metro dev server on a PC
      # ("Could not connect to development server"). A release-variant APK embeds the bundle, so it runs standalone.
      # Expo's generated project signs release builds with the debug keystore, so it installs on a phone for testing.
      - name: Gradle standalone build (JS bundle embedded)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-coach-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
