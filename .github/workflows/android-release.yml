name: Android signed release (optional)

# Manual only. Requires these repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Create a keystore once with:  keytool -genkeypair -v -storetype PKCS12 -keystore release.jks -alias kinetic -keyalg RSA -keysize 2048 -validity 10000
# Never commit the keystore. If any secret is missing, this workflow stops with a clear error.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do if [ -z "${!v}" ]; then echo "Missing secret for $v. See the comments at the top of this workflow."; exit 1; fi; done

      - run: npm install --no-audit --no-fund
      - run: bash scripts/fetch-model.sh
      - run: npm run typecheck
      - run: npm test
      - run: npx expo prebuild --platform android --no-install

      - name: Build release APK (unsigned by us)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign with your keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KA" --ks-pass env:KSP --key-pass env:KP --out kinetic-coach-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose kinetic-coach-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: kinetic-coach-release-apk
          path: kinetic-coach-release.apk
          if-no-files-found: error
